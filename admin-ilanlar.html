<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İlan Onayları | Giresun Yöresel Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{--forest:#1B4D2E; --forest-dark:#123821; --cream:#F7F5EF; --text:#233327; --muted:#6B7D71; --error:#B3432B;}
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Segoe UI', system-ui, sans-serif; background:var(--cream); color:var(--text);}
  header{background:var(--forest); color:#fff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  header .title{font-weight:700; font-size:17px;}
  header nav a{color:#EAF3EC; text-decoration:none; font-size:13px; margin-left:16px; opacity:.85;}
  .wrap{max-width:900px; margin:0 auto; padding:24px 20px 60px;}

  .gate{max-width:340px; margin:80px auto; background:#fff; padding:28px; border-radius:14px; box-shadow:0 8px 24px rgba(18,56,33,.1); text-align:center;}
  .gate input{width:100%; padding:11px; border:1.5px solid #DCE3DC; border-radius:8px; font-size:14px; margin:14px 0;}
  .gate button{width:100%; padding:11px; background:var(--forest); color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer;}
  .gate .err{color:var(--error); font-size:13px; display:none;}

  .tabs{display:flex; gap:8px; margin-bottom:18px;}
  .tab{padding:8px 16px; border-radius:20px; border:1.5px solid #DCE3DC; background:#fff; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer;}
  .tab.active{background:var(--forest); border-color:var(--forest); color:#fff;}

  .ilan-card{background:#fff; border-radius:12px; padding:20px; margin-bottom:14px; box-shadow:0 4px 16px rgba(18,56,33,.06);}
  .ilan-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .ilan-sahibi{font-size:12.5px; color:var(--muted);}
  .badge{padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;}
  .badge.bekliyor{background:#FBF3E3; color:#8A6100;}
  .badge.onaylandi{background:#E7F3EA; color:#1B4D2E;}
  .badge.reddedildi{background:#F3E5E1; color:var(--error);}
  .tip-etiket{font-size:11px; font-weight:700; padding:3px 9px; border-radius:12px; background:#EEE; color:#555; margin-left:6px;}
  .ilan-card h3{font-size:16px; margin:6px 0;}
  .ilan-card .aciklama{font-size:13.5px; line-height:1.6; color:var(--text); white-space:pre-wrap; margin-bottom:10px; background:#FBFAF7; padding:10px; border-radius:8px;}
  .meta-line{font-size:12.5px; color:var(--muted); margin-bottom:12px;}
  .actions{display:flex; gap:10px;}
  .btn{padding:8px 16px; border-radius:8px; border:none; font-size:13px; font-weight:700; cursor:pointer;}
  .btn-onay{background:var(--forest); color:#fff;}
  .btn-red{background:#fff; color:var(--error); border:1.5px solid var(--error);}
  .empty{text-align:center; padding:50px; color:var(--muted);}
</style>
</head>
<body>

<header>
  <div class="title">Giresun Yöresel — İlan Onayları</div>
  <nav>
    <a href="admin-uyeler.html">Üyeler</a>
    <a href="admin-yazilar.html">Yazılar</a>
  </nav>
</header>

<div class="gate" id="gate">
  <h2 style="margin-top:0; font-size:16px;">Admin Girişi</h2>
  <input type="password" id="pass" placeholder="Şifre">
  <button onclick="checkPass()">Giriş</button>
  <div class="err" id="err">Şifre hatalı.</div>
</div>

<div class="wrap" id="content" style="display:none;">
  <div class="tabs" id="tabs">
    <div class="tab active" data-durum="bekliyor">Bekleyen</div>
    <div class="tab" data-durum="onaylandi">Onaylanan</div>
    <div class="tab" data-durum="reddedildi">Reddedilen</div>
  </div>
  <div id="ilanlarWrap"></div>
</div>

<script src="supabase-js.min.js"></script>
<script>
  const SUPABASE_URL = "https://gbmrzjomyjrzoocryggi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_o03NNtF3nD1j_Pqse9wdqg_mla0fAaj";
  const ADMIN_PASS = "giresun2026";

  let sb = null;
  try {
    if (window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (e) { console.error(e); }

  let tumIlanlar = [];
  let aktifTab = 'bekliyor';

  function checkPass(){
    const val = document.getElementById('pass').value;
    if (val === ADMIN_PASS) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      loadIlanlar();
    } else {
      document.getElementById('err').style.display = 'block';
    }
  }
  document.getElementById('pass').addEventListener('keydown', e => { if(e.key==='Enter') checkPass(); });

  document.getElementById('tabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    aktifTab = tab.dataset.durum;
    render();
  });

  async function loadIlanlar(){
    const wrap = document.getElementById('ilanlarWrap');
    if (!sb) {
      wrap.innerHTML = '<div class="empty">Bağlantı kurulamadı.</div>';
      return;
    }

    const { data: ilanlar, error } = await sb
      .from('ilanlar')
      .select('*')
      .order('olusturma_tarihi', { ascending: false });

    if (error) {
      wrap.innerHTML = `<div class="empty">Yüklenemedi: ${error.message}</div>`;
      return;
    }

    const uyeIds = [...new Set((ilanlar || []).map(i => i.uye_id))];
    const { data: uyeler } = await sb.from('uyeler').select('id, ad_soyad, email, telefon').in('id', uyeIds);
    const uyeMap = {};
    (uyeler || []).forEach(u => uyeMap[u.id] = u);

    tumIlanlar = (ilanlar || []).map(i => ({ ...i, sahibi: uyeMap[i.uye_id] || {} }));
    render();
  }

  function render(){
    const wrap = document.getElementById('ilanlarWrap');
    const list = tumIlanlar.filter(i => i.onay_durumu === aktifTab);

    if (list.length === 0) {
      wrap.innerHTML = '<div class="empty">Bu durumda ilan yok.</div>';
      return;
    }

    wrap.innerHTML = list.map(i => {
      const tarih = new Date(i.olusturma_tarihi).toLocaleDateString('tr-TR');
      const tipEtiket = i.ilan_tipi === 'isci_ariyorum' ? '🌰 İşçi Arıyor' : '🙋 Müsait';

      const metaParcalari = [];
      if (i.ucret) metaParcalari.push(`💰 ${i.ucret}`);
      if (i.baslangic_tarihi) metaParcalari.push(`📅 ${i.baslangic_tarihi}${i.bitis_tarihi ? ' – ' + i.bitis_tarihi : ''}`);
      metaParcalari.push(`📍 ${i.koy}`);
      metaParcalari.push(i.telefon_paylas ? '📞 Telefon paylaşılıyor' : '✉️ Sadece e-posta');

      const actionsHtml = i.onay_durumu === 'bekliyor'
        ? `<div class="actions">
             <button class="btn btn-onay" onclick="onayla('${i.id}')">✓ Onayla</button>
             <button class="btn btn-red" onclick="reddet('${i.id}')">✕ Reddet</button>
           </div>`
        : '';

      return `
        <div class="ilan-card">
          <div class="ilan-top">
            <div class="ilan-sahibi">${i.sahibi.ad_soyad || 'Bilinmeyen'} (${i.sahibi.email || '—'}) · ${tarih}</div>
            <span class="badge ${i.onay_durumu}">${i.onay_durumu}</span>
          </div>
          <h3>${i.baslik} <span class="tip-etiket">${tipEtiket}</span></h3>
          <div class="aciklama">${i.aciklama}</div>
          <div class="meta-line">${metaParcalari.join('  ·  ')}</div>
          ${actionsHtml}
        </div>
      `;
    }).join('');
  }

  async function onayla(id){
    const { error } = await sb.from('ilanlar').update({ onay_durumu: 'onaylandi' }).eq('id', id);
    if (error) { alert('Onaylanamadı: ' + error.message); return; }
    const i = tumIlanlar.find(x => x.id === id);
    if (i) i.onay_durumu = 'onaylandi';
    render();
  }

  async function reddet(id){
    const { error } = await sb.from('ilanlar').update({ onay_durumu: 'reddedildi' }).eq('id', id);
    if (error) { alert('Reddedilemedi: ' + error.message); return; }
    const i = tumIlanlar.find(x => x.id === id);
    if (i) i.onay_durumu = 'reddedildi';
    render();
  }
</script>
</body>
</html>
