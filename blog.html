<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | Giresun Yöresel</title>
<meta name="description" content="Tepeküknarlı köyünden hikayeler, tarifler ve fındık zamanından kareler.">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7921392783233437"
     crossorigin="anonymous"></script>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --forest:#1B4D2E; --forest-dark:#123821; --forest-light:#2E6B45;
    --cream:#F7F5EF; --gold:#C89B3C; --text:#233327; --muted:#6B7D71;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; background:var(--cream); color:var(--text);}
  header{
    background:var(--forest); padding:22px 24px; display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:10px;
  }
  .logo{color:#fff; font-weight:700; font-size:18px; text-decoration:none;}
  .logo span{color:var(--gold);}
  .header-actions{display:flex; gap:10px; align-items:center;}
  .header-actions a{color:#EAF3EC; text-decoration:none; font-size:13.5px;}
  .btn-yaz{
    background:var(--gold); color:#123821 !important; padding:8px 16px; border-radius:20px;
    font-weight:700; font-size:13px !important;
  }

  .wrap{max-width:760px; margin:0 auto; padding:32px 20px 60px;}
  .page-title{font-size:24px; font-weight:700; margin-bottom:6px; color:var(--forest-dark);}
  .page-sub{color:var(--muted); font-size:14px; margin-bottom:28px;}

  .filters{display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;}
  .filter-chip{
    padding:6px 14px; border-radius:20px; border:1.5px solid #DCE3DC; background:#fff;
    font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer;
  }
  .filter-chip.active{background:var(--forest); border-color:var(--forest); color:#fff;}

  .post{background:#fff; border-radius:var(--radius); padding:22px; margin-bottom:18px; box-shadow:0 6px 20px rgba(18,56,33,.06);}
  .post-meta{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px; color:var(--muted);}
  .post-avatar{width:28px; height:28px; border-radius:50%; background:var(--forest); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}
  .post-cat{
    display:inline-block; background:#EAF1E9; color:var(--forest-dark); font-size:11px; font-weight:700;
    padding:2px 9px; border-radius:12px; margin-left:auto;
  }
  .post h2{font-size:18px; margin:0 0 10px; color:var(--forest-dark);}
  .post-body{font-size:14.5px; line-height:1.7; color:var(--text); white-space:pre-wrap; margin-bottom:14px;}
  .post-media{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:8px;}
  .post-media img, .post-media video{width:100%; height:140px; object-fit:cover; border-radius:10px; background:#eee; cursor:pointer;}

  .empty, .loading{text-align:center; padding:60px 20px; color:var(--muted); font-size:14px;}

  /* Lightbox */
  .lightbox{
    display:none; position:fixed; inset:0; background:rgba(15,25,18,.92); z-index:1000;
    align-items:center; justify-content:center; padding:20px;
  }
  .lightbox.open{display:flex;}
  .lightbox img, .lightbox video{max-width:100%; max-height:90vh; border-radius:10px;}
  .lightbox-close{position:absolute; top:20px; right:24px; color:#fff; font-size:28px; cursor:pointer; background:none; border:none;}

  /* Yorumlar */
  .comments{margin-top:16px; padding-top:14px; border-top:1px solid #F0F0EA;}
  .comments-title{font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:.3px;}
  .comment{display:flex; gap:9px; margin-bottom:12px;}
  .comment-avatar{width:26px; height:26px; border-radius:50%; background:var(--forest-light); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}
  .comment-body{flex:1; background:#FBFAF7; border-radius:10px; padding:9px 12px;}
  .comment-head{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .comment-yazar{font-size:12.5px; font-weight:700; color:var(--forest-dark);}
  .comment-tarih{font-size:11px; color:var(--muted);}
  .comment-metin{font-size:13.5px; line-height:1.5; margin-top:2px; white-space:pre-wrap;}
  .comment-sil{background:none; border:none; color:var(--error); font-size:11px; cursor:pointer; padding:0; margin-top:4px;}
  .comment-form{display:flex; gap:8px; margin-top:10px;}
  .comment-form input{flex:1; padding:9px 12px; border:1.5px solid #DCE3DC; border-radius:20px; font-size:13.5px; font-family:inherit;}
  .comment-form input:focus{outline:none; border-color:var(--forest-light);}
  .comment-form button{padding:9px 16px; background:var(--forest); color:#fff; border:none; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .comment-login-note{font-size:12.5px; color:var(--muted);}
  .comment-login-note a{color:var(--forest); font-weight:700; text-decoration:none;}
  .no-comment{font-size:13px; color:var(--muted); margin-bottom:10px;}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">Giresun <span>Yöresel</span></a>
  <div class="header-actions">
    <a href="ilanlar.html">İlanlar</a>
    <a href="yazi-paylas.html" class="btn-yaz">✍️ Yazı Paylaş</a>
  </div>
</header>

<div class="wrap">
  <div class="page-title">Köyümüzden Hikayeler</div>
  <div class="page-sub">Tepeküknarlı'dan üyelerimizin paylaştığı yazılar, anılar ve tarifler.</div>

  <div class="filters" id="filters">
    <div class="filter-chip active" data-kat="">Tümü</div>
  </div>

  <div id="postsWrap"><div class="loading">Yükleniyor...</div></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <div id="lightboxContent"></div>
</div>

<script src="supabase-js.min.js"></script>
<script>
  const SUPABASE_URL = "https://gbmrzjomyjrzoocryggi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_o03NNtF3nD1j_Pqse9wdqg_mla0fAaj";
  let sb = null;
  try {
    if (window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (e) { console.error(e); }

  const postsWrap = document.getElementById('postsWrap');
  const filtersEl = document.getElementById('filters');
  let tumYazilar = [];
  let aktifKategori = '';
  let currentUserId = null;
  let currentUserAd = '';

  async function checkSession(){
    if (!sb) return;
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      currentUserId = session.user.id;
      const { data: uye } = await sb.from('uyeler').select('ad_soyad').eq('id', currentUserId).single();
      if (uye) currentUserAd = uye.ad_soyad;
    }
  }

  function mediaUrl(path){
    return `${SUPABASE_URL}/storage/v1/object/public/medya/${path}`;
  }

  async function loadPosts(){
    if (!sb) {
      postsWrap.innerHTML = '<div class="loading">Bağlantı kurulamadı, sayfayı yenilemeyi dener misin?</div>';
      return;
    }

    const { data: gonderiler, error } = await sb
      .from('gonderiler')
      .select('*')
      .eq('onay_durumu', 'onaylandi')
      .order('olusturma_tarihi', { ascending: false });

    if (error || !gonderiler) {
      postsWrap.innerHTML = '<div class="loading">Yazılar yüklenemedi.</div>';
      return;
    }

    if (gonderiler.length === 0) {
      postsWrap.innerHTML = '<div class="empty">Henüz onaylanmış bir yazı yok. İlk yazıyı sen paylaşabilirsin!</div>';
      return;
    }

    // yazarları çek
    const uyeIds = [...new Set(gonderiler.map(g => g.uye_id))];
    const { data: uyeler } = await sb.from('uyeler').select('id, ad_soyad, koy').in('id', uyeIds);
    const uyeMap = {};
    (uyeler || []).forEach(u => uyeMap[u.id] = u);

    // medyaları çek
    const gonderiIds = gonderiler.map(g => g.id);
    const { data: medyalar } = await sb.from('gonderi_medya').select('*').in('gonderi_id', gonderiIds).order('sira');
    const medyaMap = {};
    (medyalar || []).forEach(m => {
      if (!medyaMap[m.gonderi_id]) medyaMap[m.gonderi_id] = [];
      medyaMap[m.gonderi_id].push(m);
    });

    // yorumları çek
    const { data: yorumlar } = await sb.from('yorumlar').select('*').in('gonderi_id', gonderiIds).order('olusturma_tarihi');
    const yorumUyeIds = [...new Set((yorumlar || []).map(y => y.uye_id))];
    let yorumUyeMap = {};
    if (yorumUyeIds.length) {
      const { data: yorumUyeler } = await sb.from('uyeler').select('id, ad_soyad').in('id', yorumUyeIds);
      (yorumUyeler || []).forEach(u => yorumUyeMap[u.id] = u);
    }
    const yorumMap = {};
    (yorumlar || []).forEach(y => {
      if (!yorumMap[y.gonderi_id]) yorumMap[y.gonderi_id] = [];
      yorumMap[y.gonderi_id].push({ ...y, yazar: yorumUyeMap[y.uye_id] || { ad_soyad: 'Üye' } });
    });

    tumYazilar = gonderiler.map(g => ({
      ...g,
      yazar: uyeMap[g.uye_id] || { ad_soyad: 'Bilinmeyen Üye', koy: '' },
      medya: medyaMap[g.id] || [],
      yorumlar: yorumMap[g.id] || []
    }));

    renderFilters();
    renderPosts(tumYazilar);
  }

  function renderFilters(){
    const kategoriler = [...new Set(tumYazilar.map(y => y.kategori).filter(Boolean))];
    filtersEl.innerHTML = `<div class="filter-chip active" data-kat="">Tümü</div>` +
      kategoriler.map(k => `<div class="filter-chip" data-kat="${k}">${k}</div>`).join('');

    filtersEl.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        filtersEl.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        aktifKategori = chip.dataset.kat;
        const filtered = aktifKategori ? tumYazilar.filter(y => y.kategori === aktifKategori) : tumYazilar;
        renderPosts(filtered);
      });
    });
  }

  function renderPosts(list){
    if (list.length === 0) {
      postsWrap.innerHTML = '<div class="empty">Bu kategoride henüz yazı yok.</div>';
      return;
    }
    postsWrap.innerHTML = list.map(y => {
      const bas = (y.yazar.ad_soyad || '?').charAt(0).toUpperCase();
      const tarih = new Date(y.olusturma_tarihi).toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' });
      const mediaHtml = y.medya.length ? `<div class="post-media">${
        y.medya.map(m => m.dosya_tipi === 'video'
          ? `<video src="${mediaUrl(m.dosya_yolu)}" onclick="openLightbox('${mediaUrl(m.dosya_yolu)}','video')"></video>`
          : `<img src="${mediaUrl(m.dosya_yolu)}" onclick="openLightbox('${mediaUrl(m.dosya_yolu)}','img')">`
        ).join('')
      }</div>` : '';

      const yorumlarHtml = y.yorumlar.length
        ? y.yorumlar.map(yr => {
            const ybas = (yr.yazar.ad_soyad || '?').charAt(0).toUpperCase();
            const ytarih = new Date(yr.olusturma_tarihi).toLocaleDateString('tr-TR');
            const silBtn = (currentUserId && yr.uye_id === currentUserId)
              ? `<button class="comment-sil" onclick="yorumSil('${yr.id}','${y.id}')">Sil</button>` : '';
            return `
              <div class="comment">
                <div class="comment-avatar">${ybas}</div>
                <div class="comment-body">
                  <div class="comment-head">
                    <span class="comment-yazar">${yr.yazar.ad_soyad}</span>
                    <span class="comment-tarih">${ytarih}</span>
                  </div>
                  <div class="comment-metin">${yr.icerik}</div>
                  ${silBtn}
                </div>
              </div>
            `;
          }).join('')
        : '<div class="no-comment">Henüz yorum yok, ilk yorumu sen yazabilirsin.</div>';

      const yorumFormHtml = currentUserId
        ? `<form class="comment-form" onsubmit="yorumGonder(event, '${y.id}')">
             <input type="text" placeholder="Bir yorum yaz..." required maxlength="500">
             <button type="submit">Gönder</button>
           </form>`
        : `<div class="comment-login-note">Yorum yapmak için <a href="giris.html">giriş yap</a>.</div>`;

      return `
        <div class="post">
          <div class="post-meta">
            <div class="post-avatar">${bas}</div>
            <div>${y.yazar.ad_soyad}${y.yazar.koy ? ' · ' + y.yazar.koy : ''} · ${tarih}</div>
            ${y.kategori ? `<div class="post-cat">${y.kategori}</div>` : ''}
          </div>
          <h2>${y.baslik}</h2>
          <div class="post-body">${y.icerik}</div>
          ${mediaHtml}
          <div class="comments">
            <div class="comments-title">Yorumlar (${y.yorumlar.length})</div>
            ${yorumlarHtml}
            ${yorumFormHtml}
          </div>
        </div>
      `;
    }).join('');
  }

  function openLightbox(url, type){
    const content = document.getElementById('lightboxContent');
    content.innerHTML = type === 'video'
      ? `<video src="${url}" controls autoplay></video>`
      : `<img src="${url}">`;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightboxContent').innerHTML = '';
  }

  window.yorumGonder = async function(e, gonderiId){
    e.preventDefault();
    const input = e.target.querySelector('input');
    const icerik = input.value.trim();
    if (!icerik || !currentUserId) return;

    const btn = e.target.querySelector('button');
    btn.disabled = true;

    const { error } = await sb.from('yorumlar').insert({
      gonderi_id: gonderiId, uye_id: currentUserId, icerik
    });

    if (error) {
      alert('Yorum gönderilemedi: ' + error.message);
      btn.disabled = false;
      return;
    }

    // Yerelde de ekleyip yeniden çiz (sayfayı baştan yüklemeye gerek yok)
    const post = tumYazilar.find(y => y.id === gonderiId);
    if (post) {
      post.yorumlar.push({
        id: 'temp-' + Date.now(),
        gonderi_id: gonderiId,
        uye_id: currentUserId,
        icerik,
        olusturma_tarihi: new Date().toISOString(),
        yazar: { ad_soyad: currentUserAd || 'Sen' }
      });
    }
    const filtered = aktifKategori ? tumYazilar.filter(y => y.kategori === aktifKategori) : tumYazilar;
    renderPosts(filtered);
  };

  window.yorumSil = async function(yorumId, gonderiId){
    if (!confirm('Yorumu silmek istediğine emin misin?')) return;
    const { error } = await sb.from('yorumlar').delete().eq('id', yorumId);
    if (error) { alert('Silinemedi: ' + error.message); return; }
    const post = tumYazilar.find(y => y.id === gonderiId);
    if (post) post.yorumlar = post.yorumlar.filter(y => y.id !== yorumId);
    const filtered = aktifKategori ? tumYazilar.filter(y => y.kategori === aktifKategori) : tumYazilar;
    renderPosts(filtered);
  };

  (async function(){
    await checkSession();
    await loadPosts();
  })();
</script>
</body>
</html>
